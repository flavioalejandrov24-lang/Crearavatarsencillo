<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar AI Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .blue-glow:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
        }
        .neon-yellow {
            color: #fbbf24;
            text-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24;
        }
        .btn-test { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
        .btn-test:hover { background: rgba(234, 179, 8, 0.3); }
        .btn-clear { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.3); }
        .btn-save { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
        .btn-save:hover { background: rgba(34, 197, 94, 0.3); }

        .custom-slider { -webkit-appearance: none; height: 6px; background: #1e3a8a; border-radius: 5px; }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #3b82f6; cursor: pointer; border-radius: 50%; }

        .chat-bg-main {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }
        .chat-bubble-ai {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.2rem 1.2rem 1.2rem 0.2rem;
            color: #ffffff;
        }
        .chat-bubble-user {
            background: rgba(59, 130, 246, 0.8);
            border-radius: 1.2rem 1.2rem 0.2rem 1.2rem;
            color: white;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="app" class="w-full max-w-lg h-[92vh] flex flex-col relative z-10 px-4">
        
        <!-- Pantalla de Formulario -->
        <div id="form-screen" class="glass-card p-6 space-y-6 overflow-y-auto h-full hidden">
            <h1 class="text-3xl font-bold neon-yellow text-center">Configura tu Avatar</h1>
            
            <form id="avatar-form" class="space-y-4">
                <div class="flex flex-col items-center">
                    <div id="image-preview" onclick="document.getElementById('photo-input').click()" class="w-32 h-32 rounded-full border-2 border-dashed border-blue-900 flex items-center justify-center overflow-hidden mb-2 bg-black/40 cursor-pointer hover:border-blue-500 transition-colors">
                        <span id="preview-text" class="text-blue-700 text-xs text-center px-2">Subir Foto</span>
                    </div>
                    <input type="file" id="photo-input" accept="image/*" class="hidden">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Nombre</label>
                    <input type="text" id="name-input" class="w-full bg-black/50 border border-blue-900 rounded-lg p-3 text-white blue-glow">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Personalidad</label>
                    <textarea id="personality-input" class="w-full bg-black/50 border border-blue-900 rounded-lg p-3 text-white h-20 resize-none blue-glow"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Voz de Gemini</label>
                    <select id="voice-select" class="w-full bg-black/50 border border-blue-900 rounded-lg p-3 text-white blue-glow">
                        <option value="Zephyr">Zephyr (Cálida)</option>
                        <option value="Charon">Charon (Profunda)</option>
                        <option value="Fenrir">Fenrir (Fuerte)</option>
                        <option value="Orus">Orus (Seria)</option>
                        <option value="Enceladus">Enceladus (Juvenil)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Velocidad</label>
                        <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full custom-slider">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Tono</label>
                        <input type="range" id="pitch-slider" min="-10" max="10" step="1" value="0" class="w-full custom-slider">
                    </div>
                </div>

                <div class="space-y-3 pt-4">
                    <button type="button" id="test-audio-btn" class="w-full p-3 rounded-xl font-semibold btn-test transition">
                        Prueba de Audio
                    </button>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="clear-btn" class="p-3 rounded-xl font-semibold btn-clear transition">Limpiar</button>
                        <button type="submit" id="save-btn" class="p-3 rounded-xl font-bold btn-save transition">Guardar</button>
                    </div>
                </div>
            </form>
            
            <!-- Firma -->
            <div class="text-right text-white text-sm opacity-60 pt-2">
                Created by Angel
            </div>
        </div>

        <!-- Pantalla de Chat -->
        <div id="chat-screen" class="glass-card flex-col h-full overflow-hidden flex">
            <!-- Header -->
            <div class="p-4 border-b border-blue-900 flex items-center justify-between bg-black/60 z-10">
                <button onclick="createNewAvatar()" class="text-blue-400 hover:text-white transition">Nuevo</button>
                <div class="text-center flex flex-col items-center">
                    <img id="chat-avatar-img" src="" class="w-16 h-16 rounded-2xl border-2 border-white object-cover shadow-lg">
                </div>
                <button onclick="editAvatar()" class="text-blue-400 hover:text-white transition">Editar</button>
            </div>

            <!-- Chat -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col chat-bg-main"></div>

            <!-- Input -->
            <div class="p-4 bg-black/80 border-t border-blue-900">
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="Escribe un mensaje..." class="flex-1 bg-blue-900/20 border border-blue-800 rounded-full px-5 py-3 text-white outline-none focus:border-blue-500">
                    <button id="send-btn" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-full transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "AIzaSyB5hAqxCbQF89ufj2xR_iTmCFgCw2pm2jY";
        const STORAGE_KEY = "avatar_companion_data";
        let currentAvatar = null;
        let chatHistory = [];

        const formScreen = document.getElementById('form-screen');
        const chatScreen = document.getElementById('chat-screen');
        const avatarForm = document.getElementById('avatar-form');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const photoInput = document.getElementById('photo-input');
        const imagePreview = document.getElementById('image-preview');

        // Inicializar aplicación
        window.onload = () => {
            loadData();
            if (currentAvatar) {
                showChat();
            } else {
                showForm();
            }
        };

        // Cargar datos desde localStorage
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                const data = JSON.parse(saved);
                currentAvatar = data.avatar;
                chatHistory = data.history || [];
            }
        }

        // Guardar datos en localStorage
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                avatar: currentAvatar,
                history: chatHistory
            }));
        }

        // Mostrar formulario
        function showForm() {
            chatScreen.classList.add('hidden');
            formScreen.classList.remove('hidden');
        }

        // Mostrar chat
        function showChat() {
            formScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            chatScreen.classList.add('flex');
            
            document.getElementById('chat-avatar-img').src = currentAvatar.photo;
            chatMessages.innerHTML = '';
            chatHistory.forEach(msg => addMessageToUI(msg.text, msg.role));
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Crear nuevo avatar
        function createNewAvatar() {
            if (confirm('¿Crear un nuevo avatar? Se perderá el chat actual.')) {
                currentAvatar = null;
                chatHistory = [];
                localStorage.removeItem(STORAGE_KEY);
                avatarForm.reset();
                imagePreview.innerHTML = '<span class="text-blue-700 text-xs text-center px-2">Subir Foto</span>';
                delete imagePreview.dataset.src;
                showForm();
            }
        }

        // Editar avatar
        function editAvatar() {
            document.getElementById('name-input').value = currentAvatar.name;
            document.getElementById('personality-input').value = currentAvatar.personality;
            document.getElementById('voice-select').value = currentAvatar.voice;
            document.getElementById('speed-slider').value = currentAvatar.speed;
            document.getElementById('pitch-slider').value = currentAvatar.pitch;
            imagePreview.innerHTML = `<img src="${currentAvatar.photo}" class="w-full h-full object-cover">`;
            imagePreview.dataset.src = currentAvatar.photo;
            showForm();
        }

        // Manejar carga de imagen
        photoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    imagePreview.innerHTML = `<img src="${ev.target.result}" class="w-full h-full object-cover">`;
                    imagePreview.dataset.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        // Limpiar formulario
        document.getElementById('clear-btn').onclick = () => {
            avatarForm.reset();
            imagePreview.innerHTML = '<span class="text-blue-700 text-xs text-center px-2">Subir Foto</span>';
            delete imagePreview.dataset.src;
        };

        // Probar audio
        document.getElementById('test-audio-btn').onclick = () => {
            const voice = document.getElementById('voice-select').value;
            const speed = document.getElementById('speed-slider').value;
            speakText("Hola, esta es una prueba de voz.", voice, speed);
        };

        // Guardar avatar
        avatarForm.onsubmit = (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name-input').value.trim();
            const personality = document.getElementById('personality-input').value.trim();
            const photo = imagePreview.dataset.src;
            
            if (!name || !personality || !photo) {
                alert("Por favor completa todos los campos.");
                return;
            }
            
            currentAvatar = {
                name,
                personality,
                photo,
                voice: document.getElementById('voice-select').value,
                speed: document.getElementById('speed-slider').value,
                pitch: document.getElementById('pitch-slider').value
            };
            
            saveData();
            showChat();
        };

        // Enviar mensaje
        document.getElementById('send-btn').onclick = sendMessage;
        chatInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };

        async function sendMessage() {
            const userMessage = chatInput.value.trim();
            if (!userMessage) return;
            
            addMessageToUI(userMessage, 'user');
            chatHistory.push({ role: 'user', text: userMessage });
            chatInput.value = '';
            saveData();

            try {
                const systemPrompt = `Eres ${currentAvatar.name}. Carácter: ${currentAvatar.personality}. IMPORTANTE: Responde siempre con lógica, coherencia y sentido común. Sé muy breve (máximo 2 frases).`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userMessage }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });
                
                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No entiendo.";
                
                addMessageToUI(aiText, 'ai');
                chatHistory.push({ role: 'ai', text: aiText });
                saveData();
                
                speakText(aiText, currentAvatar.voice, currentAvatar.speed);
            } catch (error) {
                console.error('Error:', error);
                addMessageToUI("Error de conexión. Intenta de nuevo.", 'ai');
            }
        }

        // Agregar mensaje a la UI
        function addMessageToUI(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = role === 'ai' 
                ? 'chat-bubble-ai p-3 max-w-[85%] self-start' 
                : 'chat-bubble-user p-3 max-w-[85%] self-end';
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Sintetizar voz
        async function speakText(text, voice, speed) {
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text }] }],
                        generationConfig: {
                            responseModalities: ["AUDIO"],
                            speechConfig: {
                                voiceConfig: {
                                    prebuiltVoiceConfig: { voiceName: voice }
                                }
                            }
                        }
                    })
                });
                
                const data = await response.json();
                const audioData = data.candidates[0].content.parts[0].inlineData.data;
                const mimeType = data.candidates[0].content.parts[0].inlineData.mimeType;
                const sampleRate = parseInt(mimeType.split('rate=')[1]) || 24000;
                
                playAudioData(audioData, sampleRate);
            } catch (error) {
                console.error('Error al sintetizar voz:', error);
            }
        }

        // Reproducir audio
        function playAudioData(base64Data, sampleRate) {
            const binaryString = atob(base64Data);
            const pcmData = new Int16Array(binaryString.length / 2);
            
            for (let i = 0; i < binaryString.length; i += 2) {
                pcmData[i / 2] = (binaryString.charCodeAt(i + 1) << 8) | binaryString.charCodeAt(i);
            }
            
            const wavHeader = createWavHeader(pcmData.length * 2, sampleRate);
            const audioBlob = new Blob([wavHeader, pcmData], { type: 'audio/wav' });
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            
            audio.play();
            audio.onended = () => URL.revokeObjectURL(audioUrl);
        }

        // Crear encabezado WAV
        function createWavHeader(dataLength, sampleRate) {
            const buffer = new ArrayBuffer(44);
            const view = new DataView(buffer);
            
            const writeString = (offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };
            
            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, dataLength, true);
            
            return buffer;
        }
    </script>
</body>
</html>
