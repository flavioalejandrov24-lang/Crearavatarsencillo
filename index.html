<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avatar AI Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #050505;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
        }
        .blue-glow:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            border-color: #3b82f6;
        }
        .neon-yellow {
            color: #fbbf24;
            text-shadow: 0 0 10px #fbbf24, 0 0 20px #fbbf24;
        }
        .btn-test { background: rgba(234, 179, 8, 0.2); color: #facc15; border: 1px solid rgba(234, 179, 8, 0.4); }
        .btn-test:hover { background: rgba(234, 179, 8, 0.3); }
        .btn-clear { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.3); }
        .btn-save { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
        .btn-save:hover { background: rgba(34, 197, 94, 0.3); }
        .btn-blue { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.4); }
        .btn-blue:hover { background: rgba(59, 130, 246, 0.3); }
        .btn-yellow { background: rgba(234, 179, 8, 0.2); color: #fbbf24; border: 1px solid rgba(234, 179, 8, 0.4); }
        .btn-yellow:hover { background: rgba(234, 179, 8, 0.3); }

        .custom-slider { -webkit-appearance: none; height: 6px; background: #1e3a8a; border-radius: 5px; }
        .custom-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: #3b82f6; cursor: pointer; border-radius: 50%; }

        .chat-bg-main {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
        }
        .chat-bubble-ai {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.2rem 1.2rem 1.2rem 0.2rem;
            color: #ffffff;
        }
        .chat-bubble-user {
            background: rgba(59, 130, 246, 0.8);
            border-radius: 1.2rem 1.2rem 0.2rem 1.2rem;
            color: white;
        }
        .typing-indicator {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.2rem;
            padding: 0.75rem 1rem;
            max-width: 85%;
            align-self: flex-start;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(59, 130, 246, 0.5); border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center">

    <div id="app" class="w-full max-w-lg h-[92vh] flex flex-col relative z-10 px-4">
        
        <!-- Pantalla de Formulario -->
        <div id="form-screen" class="glass-card p-6 space-y-6 overflow-y-auto h-full">
            <h1 class="text-3xl font-bold neon-yellow text-center">Configura tu Avatar</h1>
            
            <form id="avatar-form" class="space-y-4">
                <div class="flex flex-col items-center">
                    <div id="image-preview" onclick="document.getElementById('photo-input').click()" class="w-32 h-32 rounded-full border-2 border-dashed border-blue-900 flex items-center justify-center overflow-hidden mb-2 bg-black/40 cursor-pointer hover:border-blue-500 transition-colors">
                        <span id="preview-text" class="text-blue-700 text-xs text-center px-2">Subir Foto</span>
                    </div>
                    <input type="file" id="photo-input" accept="image/*" class="hidden">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Nombre</label>
                    <input type="text" id="name-input" class="w-full bg-black/50 border border-blue-900 rounded-lg p-3 text-white blue-glow" placeholder="Ej: Luna">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Personalidad</label>
                    <textarea id="personality-input" class="w-full bg-black/50 border border-blue-900 rounded-lg p-3 text-white h-20 resize-none blue-glow" placeholder="Ej: Eres amigable, divertida y siempre positiva"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Voz Piper TTS</label>
                    <select id="voice-select" class="w-full bg-black/50 border border-blue-900 rounded-lg p-3 text-white blue-glow">
                        <option value="es_MX-claude-high.onnx">Claude MX (Alta Calidad)</option>
                        <option value="es_ES-carlfm-x_low.onnx">CarlfM ES (Rápida)</option>
                        <option value="es_ES-davefx-medium.onnx">DaveFX ES (Media)</option>
                        <option value="es_AR-daniela-high.onnx">Daniela AR (Alta)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Velocidad</label>
                        <input type="range" id="speed-slider" min="0.5" max="2.0" step="0.1" value="1.0" class="w-full custom-slider">
                        <span id="speed-value" class="text-xs text-blue-400">1.0x</span>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-blue-300 mb-1 uppercase">Expresividad</label>
                        <input type="range" id="noise-slider" min="0.1" max="1.0" step="0.1" value="0.667" class="w-full custom-slider">
                        <span id="noise-value" class="text-xs text-blue-400">0.667</span>
                    </div>
                </div>

                <div class="space-y-3 pt-4">
                    <button type="button" id="test-audio-btn" class="w-full p-3 rounded-xl font-semibold btn-test transition">
                        Prueba de Voz
                    </button>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="clear-btn" class="p-3 rounded-xl font-semibold btn-clear transition">Limpiar</button>
                        <button type="submit" id="save-btn" class="p-3 rounded-xl font-bold btn-save transition">Guardar</button>
                    </div>
                </div>
            </form>
            
            <div class="text-right text-white text-sm opacity-60 pt-2">
                Created by Angel
            </div>
        </div>

        <!-- Pantalla de Chat -->
        <div id="chat-screen" class="glass-card flex-col h-full overflow-hidden hidden">
            <!-- Header -->
            <div class="p-4 border-b border-blue-900 flex items-center justify-between bg-black/60 z-10">
                <div class="flex items-center">
                    <img id="chat-avatar-img" src="" class="w-12 h-12 rounded-2xl border-2 border-white object-cover shadow-lg">
                </div>
                
                <div class="flex gap-2">
                    <button onclick="createNewAvatar()" class="btn-blue px-4 py-2 rounded-lg font-semibold transition text-sm">
                        Nuevo
                    </button>
                    <button onclick="editAvatar()" class="btn-yellow px-4 py-2 rounded-lg font-semibold transition text-sm">
                        Editar
                    </button>
                </div>
            </div>

            <!-- Chat -->
            <div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4 flex flex-col chat-bg-main"></div>

            <!-- Input -->
            <div class="p-4 bg-black/80 border-t border-blue-900">
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="Escribe un mensaje..." class="flex-1 bg-blue-900/20 border border-blue-800 rounded-full px-5 py-3 text-white outline-none focus:border-blue-500">
                    <button id="send-btn" class="bg-blue-600 hover:bg-blue-500 p-3 rounded-full transition">
                        <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const DEEPSEEK_API_KEY = "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";
        const DEEPSEEK_URL = "https://openrouter.ai/api/v1/chat/completions";
        const PIPER_TTS_URL = "https://alejandrott24-piper-tts-server.hf.space/tts";
        const MAX_TOKENS = 200;
        
        const STORAGE_KEY = "avatar_companion_data";
        let currentAvatar = null;
        let chatHistory = [];

        const formScreen = document.getElementById('form-screen');
        const chatScreen = document.getElementById('chat-screen');
        const avatarForm = document.getElementById('avatar-form');
        const chatMessages = document.getElementById('chat-messages');
        const chatInput = document.getElementById('chat-input');
        const photoInput = document.getElementById('photo-input');
        const imagePreview = document.getElementById('image-preview');

        // Actualizar valores de sliders
        document.getElementById('speed-slider').oninput = (e) => {
            document.getElementById('speed-value').textContent = e.target.value + 'x';
        };
        document.getElementById('noise-slider').oninput = (e) => {
            document.getElementById('noise-value').textContent = e.target.value;
        };

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        window.onload = () => {
            loadData();
            if (currentAvatar) {
                showChat();
            } else {
                showForm();
            }
        };

        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    currentAvatar = data.avatar;
                    chatHistory = data.history || [];
                } catch (e) {
                    console.error('Error al cargar datos:', e);
                    currentAvatar = null;
                    chatHistory = [];
                }
            }
        }

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                avatar: currentAvatar,
                history: chatHistory
            }));
        }

        // ============================================
        // NAVEGACIÓN DE PANTALLAS
        // ============================================
        function showForm() {
            chatScreen.classList.add('hidden');
            chatScreen.classList.remove('flex');
            formScreen.classList.remove('hidden');
        }

        function showChat() {
            formScreen.classList.add('hidden');
            chatScreen.classList.remove('hidden');
            chatScreen.classList.add('flex');
            
            document.getElementById('chat-avatar-img').src = currentAvatar.photo;
            chatMessages.innerHTML = '';
            chatHistory.forEach(msg => addMessageToUI(msg.text, msg.role));
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function createNewAvatar() {
            if (confirm('¿Crear un nuevo avatar? Se perderá el chat actual.')) {
                currentAvatar = null;
                chatHistory = [];
                localStorage.removeItem(STORAGE_KEY);
                avatarForm.reset();
                imagePreview.innerHTML = '<span class="text-blue-700 text-xs text-center px-2">Subir Foto</span>';
                delete imagePreview.dataset.src;
                document.getElementById('speed-value').textContent = '1.0x';
                document.getElementById('noise-value').textContent = '0.667';
                showForm();
            }
        }

        function editAvatar() {
            document.getElementById('name-input').value = currentAvatar.name;
            document.getElementById('personality-input').value = currentAvatar.personality;
            document.getElementById('voice-select').value = currentAvatar.voice;
            document.getElementById('speed-slider').value = currentAvatar.speed;
            document.getElementById('noise-slider').value = currentAvatar.noise;
            document.getElementById('speed-value').textContent = currentAvatar.speed + 'x';
            document.getElementById('noise-value').textContent = currentAvatar.noise;
            imagePreview.innerHTML = `<img src="${currentAvatar.photo}" class="w-full h-full object-cover">`;
            imagePreview.dataset.src = currentAvatar.photo;
            showForm();
        }

        // ============================================
        // MANEJO DE FORMULARIO
        // ============================================
        photoInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (ev) => {
                    imagePreview.innerHTML = `<img src="${ev.target.result}" class="w-full h-full object-cover">`;
                    imagePreview.dataset.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            }
        };

        document.getElementById('clear-btn').onclick = () => {
            avatarForm.reset();
            imagePreview.innerHTML = '<span class="text-blue-700 text-xs text-center px-2">Subir Foto</span>';
            delete imagePreview.dataset.src;
            document.getElementById('speed-value').textContent = '1.0x';
            document.getElementById('noise-value').textContent = '0.667';
        };

        document.getElementById('test-audio-btn').onclick = async () => {
            const voice = document.getElementById('voice-select').value;
            const speed = parseFloat(document.getElementById('speed-slider').value);
            const noise = parseFloat(document.getElementById('noise-slider').value);
            
            await playPiperTTS("Hola, esta es una prueba de mi voz. ¿Cómo sueno?", voice, speed, noise);
        };

        avatarForm.onsubmit = (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name-input').value.trim();
            const personality = document.getElementById('personality-input').value.trim();
            const photo = imagePreview.dataset.src;
            
            if (!name || !personality || !photo) {
                alert("Por favor completa todos los campos.");
                return;
            }
            
            currentAvatar = {
                name,
                personality,
                photo,
                voice: document.getElementById('voice-select').value,
                speed: document.getElementById('speed-slider').value,
                noise: document.getElementById('noise-slider').value
            };
            
            saveData();
            showChat();
        };

        // ============================================
        // CHAT Y MENSAJERÍA
        // ============================================
        document.getElementById('send-btn').onclick = sendMessage;
        chatInput.onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
        };
        
        async function sendMessage() {
            const userMessage = chatInput.value.trim();
            if (!userMessage) return;
            
            addMessageToUI(userMessage, 'user');
            chatHistory.push({ role: 'user', text: userMessage });
            chatInput.value = '';
            saveData();

            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typing-indicator';
            typingDiv.textContent = 'Escribiendo...';
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            const aiResponse = await getDeepSeekResponse(userMessage);
            
            document.getElementById('typing-indicator')?.remove();
            
            if (aiResponse) {
                addMessageToUI(aiResponse, 'ai');
                chatHistory.push({ role: 'ai', text: aiResponse });
                saveData();
                
                playPiperTTS(aiResponse, currentAvatar.voice, currentAvatar.speed, currentAvatar.noise);
            } else {
                addMessageToUI("Lo siento, tengo problemas de conexión. Intenta de nuevo.", 'ai');
            }
        }

        function addMessageToUI(text, role) {
            const messageDiv = document.createElement('div');
            messageDiv.className = role === 'ai' 
                ? 'chat-bubble-ai p-3 max-w-[85%] self-start' 
                : 'chat-bubble-user p-3 max-w-[85%] self-end';
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ============================================
        // INTEGRACIÓN CON DEEPSEEK
        // ============================================
        async function getDeepSeekResponse(userMessage) {
            try {
                const recentHistory = chatHistory.slice(-6).map(msg => ({
                    role: msg.role === 'ai' ? 'assistant' : 'user',
                    content: msg.text
                }));

                const response = await fetch(DEEPSEEK_URL, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': window.location.href,
                        'X-Title': 'Avatar Companion'
                    },
                    body: JSON.stringify({
                        model: "deepseek/deepseek-chat",
                        messages: [
                            { 
                                role: "system", 
                                content: `Eres ${currentAvatar.name}. ${currentAvatar.personality}

REGLAS ESTRICTAS:
- Responde de forma natural y conversacional
- NO uses asteriscos (*)
- NO uses emojis
- NO uses onomatopeyas (jaja, mmm, uff, etc)
- NO uses markdown ni formato especial
- Responde en máximo 2-3 frases cortas
- Habla como persona real, no como asistente`
                            },
                            ...recentHistory,
                            { role: "user", content: userMessage }
                        ],
                        max_tokens: MAX_TOKENS,
                        temperature: 0.8
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    console.error('❌ Error DeepSeek:', errorData);
                    return null;
                }

                const data = await response.json();
                let aiText = data.choices[0].message.content.trim();
                
                aiText = aiText.replace(/\*/g, '');
                aiText = aiText.replace(/[😀-🙏]/g, '');
                aiText = aiText.replace(/jaja|jeje|jiji|haha|jajaja/gi, '');
                
                return aiText;
            } catch (error) {
                console.error('❌ Error con DeepSeek:', error);
                return null;
            }
        }

        // ============================================
        // INTEGRACIÓN CON PIPER TTS
        // ============================================
        async function playPiperTTS(text, model, speed, noise) {
            try {
                console.log('🎤 Generando audio...');
                
                const response = await fetch(PIPER_TTS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        model: model,
                        speaker_id: 0,
                        length_scale: speed,
                        noise_scale: noise,
                        noise_w: 0.8,
                        sentence_silence: 0.2
                    })
                });
                
                if (!response.ok) {
                    console.error('❌ Error en Piper TTS');
                    return;
                }
                
                const data = await response.json();
                
                const audioBlob = base64ToBlob(data.audio, 'audio/wav');
                const audioUrl = URL.createObjectURL(audioBlob);
                const audio = new Audio(audioUrl);
                
                audio.play();
                audio.onended = () => URL.revokeObjectURL(audioUrl);
                
                console.log('✅ Audio reproducido');
            } catch (error) {
                console.error('❌ Error al reproducir audio:', error);
            }
        }

        function base64ToBlob(base64, mimeType) {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            
            const byteArray = new Uint8Array(byteNumbers);
            return new Blob([byteArray], { type: mimeType });
        }
    </script>
</body>
</html>
